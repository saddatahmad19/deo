name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate dependency lock
        run: |
          python -m pip install uv
          uv lock --check
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,google]"
      - name: Compile source and tests
        run: python -m compileall -q deo tests
      - name: Run test suite
        run: python -m pytest -q
